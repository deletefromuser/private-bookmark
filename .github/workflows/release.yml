name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.11.10)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Build extension
        run: npm run build

      - name: Get version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Zip build output
        run: |
          cd build
          zip -r "../private-bookmark-${{ steps.get_version.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body: |
            ## Private Bookmark ${{ steps.get_version.outputs.version }}

            Chrome MV3 extension release.

            Assets:
            - `private-bookmark-${{ steps.get_version.outputs.version }}.zip` — unpacked extension build. Load via `chrome://extensions` → Developer mode → Load unpacked.
          files: private-bookmark-${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: false
