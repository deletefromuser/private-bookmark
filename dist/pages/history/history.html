<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title data-i18n=history.title>Private Visit History</title><link rel=stylesheet href=/popup.71ff9254.css><script src=/popup.dc1c4c05.js></script><script src=/popup.f7e87010.js></script><script src=/popup.dddb13a9.js></script><body class="container py-3">
    <h2 data-i18n=history.heading>Private Visit History</h2>
    <div id=auth>
      <p id=auth-msg class=text-muted data-i18n=auth.enterPassword>
        Enter password to view.
      </p>
      <input id=pw type=password class="form-control mb-2" placeholder=Password data-i18n-placeholder=history.passwordPlaceholder>
      <button id=unlock class="btn btn-primary" data-i18n=view.unlock>Unlock</button>
    </div>
    <div id=content style=display:none>
      <div class="align-items-center d-flex mb-2">
        <p class="mb-0 text-muted" data-i18n=history.instruction>
          Click a title to open the corresponding page (opens in a new tab).
        </p>
        <button id=refresh-history class="btn btn-outline-secondary btn-sm ms-3" data-i18n=common.refresh>
          Refresh
        </button>
      </div>
      <div id=history-search class="card card-body mb-2">
        <div class="align-items-end g-2 row">
          <div class=col-md-4>
            <label class="form-label mb-1 small" data-i18n=history.searchTitleLabel>
              Title keywords
            </label>
            <input id=search-title class=form-control type=search placeholder="Search by title keywords" data-i18n-placeholder=history.searchTitlePlaceholder>
          </div>
          <div class=col-md-4>
            <label class="form-label mb-1 small" data-i18n=history.searchUrlLabel>
              URL keywords
            </label>
            <input id=search-url class=form-control type=search placeholder="Search by URL or domain" data-i18n-placeholder=history.searchUrlPlaceholder>
          </div>
          <div class=col-md-2>
            <label class="form-label mb-1 small" data-i18n=history.startDateLabel>
              Start date
            </label>
            <input id=search-start class=form-control type=date>
          </div>
          <div class=col-md-2>
            <label class="form-label mb-1 small" data-i18n=history.endDateLabel>
              End date
            </label>
            <input id=search-end class=form-control type=date>
          </div>
        </div>
        <div class="d-flex gap-2 mt-2">
          <button id=search-run class="btn btn-primary btn-sm" data-i18n=common.search>
            Search
          </button>
          <button id=search-clear class="btn btn-outline-secondary btn-sm" data-i18n=common.clear>
            Clear
          </button>
        </div>
      </div>
      <div id=history-list></div>
      <div class="align-items-center d-flex justify-content-between mt-2">
        <div class="align-items-center d-flex gap-2">
          <button id=hist-prev class="btn btn-outline-secondary btn-sm" data-i18n=common.prev>
            Prev
          </button>
          <div id=hist-pages class="d-flex gap-1"></div>
          <button id=hist-next class="btn btn-outline-secondary btn-sm ms-2" data-i18n=common.next>
            Next
          </button>
        </div>
        <div id=hist-page-info class="small text-muted"></div>
      </div>
      <div class=mt-3>
        <button id=close class="btn btn-secondary" data-i18n=common.close>
          Close
        </button>
      </div>
    </div>
    <script src=/popup.b080b319.js></script>
    <script src=/history.d88d3860.js></script>
