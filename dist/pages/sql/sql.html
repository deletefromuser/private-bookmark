<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1"><title data-i18n=sql.title>SQL Console</title><link rel=stylesheet href=/popup.71ff9254.css><script src=/popup.dc1c4c05.js></script><script src=/popup.f7e87010.js></script><script src=/popup.dddb13a9.js></script><body class="container py-3">
    <h2 data-i18n=sql.heading>SQL Console</h2>
    <p class=text-muted data-i18n=sql.description>
      Run read-only queries or export results. Destructive statements
      (DELETE/UPDATE/INSERT) require confirmation.
    </p>
    <div class=mb-2>
      <textarea id=sql-input class=form-control rows=6 placeholder="Enter SQL here..." data-i18n-placeholder=sql.inputPlaceholder></textarea>
    </div>
    <div class="d-flex gap-2 mb-2">
      <button id=sql-run class="btn btn-primary" data-i18n=sql.run>Run</button>
      <button id=sql-clear class="btn btn-outline-secondary" data-i18n=common.clear>
        Clear
      </button>
      <button id=sql-export class="btn btn-outline-success btn-sm" data-i18n=sql.exportResults>
        Export Last Results (JSON)
      </button>
    </div>
    <div id=sql-status class="mt-2 small text-muted"></div>
    <div id=sql-results class=mt-3></div>

    <script src=/popup.b080b319.js></script>
    <script src=/sql.ff7ede04.js></script>
