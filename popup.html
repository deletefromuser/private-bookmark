<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popup.title">Private Bookmark</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="i18n.js"></script>
  </head>

  <body class="popup-page">
    <h1 data-i18n="popup.heading">Private Bookmark</h1>

    <div
      id="status"
      aria-live="polite"
      style="margin-top: 8px; color: var(--muted)"
    ></div>

    <section id="add-current-section">
      <label id="add-current-folder-label" class="form-label mb-1" data-i18n="add.addCurrentFolder">Folder:</label>
      <select id="add-current-folder-select" class="form-select form-select-sm mb-2"></select>
      <button id="add-current" class="btn btn-info me-2" data-i18n="popup.addCurrent">
        Add Current Tab
      </button>
      <button
        id="add-current-domain"
        class="btn btn-outline-secondary ms-2"
        data-i18n="popup.monitorDomain"
      >
        Monitor Current Domain
      </button>
    </section>

    <!-- Bookmark list removed from popup (moved to view.html) -->

    <section>
      <button id="open-view" class="btn btn-primary me-2" data-i18n="popup.openView">
        Open View Page
      </button>
      <button
        id="open-history-viewer"
        class="btn btn-secondary ms-2"
        data-i18n="popup.openHistory"
      >
        Open History Viewer
      </button>
    </section>

    <script src="shared.js"></script>
    <script src="modal.js"></script>
    <script src="db.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
