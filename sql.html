<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="sql.title">SQL Console</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="i18n.js"></script>
    <script src="shared.js"></script>
    <script src="modal.js"></script>
  </head>

  <body class="container py-3">
    <h2 data-i18n="sql.heading">SQL Console</h2>
    <p class="text-muted" data-i18n="sql.description">
      Run read-only queries or export results. Destructive statements
      (DELETE/UPDATE/INSERT) require confirmation.
    </p>
    <div class="mb-2">
      <textarea
        id="sql-input"
        class="form-control"
        rows="6"
        placeholder="Enter SQL here..."
        data-i18n-placeholder="sql.inputPlaceholder"
      ></textarea>
    </div>
    <div class="mb-2 d-flex gap-2">
      <button id="sql-run" class="btn btn-primary" data-i18n="sql.run">Run</button>
      <button id="sql-clear" class="btn btn-outline-secondary" data-i18n="common.clear">
        Clear
      </button>
      <button
        id="sql-export"
        class="btn btn-sm btn-outline-success"
        data-i18n="sql.exportResults"
      >
        Export Last Results (JSON)
      </button>
    </div>
    <div id="sql-status" class="mt-2 text-muted small"></div>
    <div id="sql-results" class="mt-3"></div>

    <script src="db.js"></script>
    <script src="sql.js"></script>
  </body>
</html>
